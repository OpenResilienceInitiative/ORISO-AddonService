# Every value can be set through environment variables (relaxed binding), for example
# SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI, SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI,
# ADDONS_DISCOVERY_KUBERNETES, ADDONS_DISCOVERY_STATICADDONS, ADDONS_TOKEN_PRIVATEKEYPEM, ADDONS_USERSERVICE_BASEURL,
# ADDONS_TECHNICALCLIENT_TOKENURL, ADDONS_TECHNICALCLIENT_CLIENTID, ADDONS_TECHNICALCLIENT_CLIENTSECRET.
server:
  port: 8090
  shutdown: graceful

spring:
  application:
    name: addonservice
  datasource:
    url: jdbc:mariadb://mariadb:3306/addonservice
    username: addonservice
  jpa:
    open-in-view: false
    hibernate:
      # Liquibase owns the schema.
      ddl-auto: none
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    # Hibernate's HHH10001005 "Database info" block (INFO) logs the URL the JDBC driver reports,
    # and MariaDB Connector/J appends user and password to it. Keep this logger at WARN so the
    # database password never reaches the log. Guarded by StartupLogSecretsIntegrationTest.
    org.hibernate.orm.connections.pooling: WARN

management:
  health:
    rabbit:
      # Only meaningful when lifecycle events are on; without a broker it would report DOWN.
      enabled: ${addons.lifecycle.enabled:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

addons:
  public-path: /service/addons
